name: ci

on:
  push:
  pull_request:

jobs:
  forge:
    name: forge
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Install forge-std and OpenZeppelin
        run: forge install foundry-rs/forge-std OpenZeppelin/openzeppelin-contracts@v5.4.0 --no-commit
      - name: Format
        run: forge fmt --check
      - name: Build
        run: forge build
      - name: Test
        run: forge test

  js:
    name: lint and typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm install
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
