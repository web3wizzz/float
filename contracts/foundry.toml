[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
fs_permissions = [
    { access = "read-write", path = "./deployments" },
    { access = "read", path = "../packages/sdk/src" },
]
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/",
]

[rpc_endpoints]
aevum = "https://rpc-test.qday.info"

[invariant]
runs = 40
depth = 20
fail_on_revert = false
